name: Hourly Sync

on:
  schedule:
    # Hourly at minute 31 (offset from busy :00 slots).
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v4

      - name: Fetch dataset
        run: |
          set -euo pipefail
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/api/prop-firm-codes/ -o datasets/prop-firm-codes.json
          curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/api/prop-firm-codes/?format=html" -o datasets/prop-firm-codes.html

      - name: Fetch markdown mirrors
        run: |
          set -euo pipefail
          MD_PATHS=(
            ""
            "best-prop-firm-discounts"
            "prop-firms-list"
            "prop-firm-reviews"
            "category/prop-firm-coupon"
            "category/prop-firm-coupon/prop-firm-discount"
            "category/prop-firm-coupon/prop-firm-deal"
            "category/prop-firm-seasonal-deals"
            "category/monthly-prop-firm-coupon-codes-roundups"
            "category/seasonal-holiday-prop-firm-coupon-codes-roundups"
            "category/prop-firm-resources"
          )
          FIRM_SLUGS=$(python3 -c "
          import json
          d = json.load(open('datasets/prop-firm-codes.json'))
          for r in d['data']:
              print(r['archive_url'].rstrip('/').split('/')[-1])
          ")
          mkdir -p md
          for p in "${MD_PATHS[@]}"; do
            name="${p:-home}"
            mkdir -p "md/$(dirname "$name")"
            curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/md/$p/" -o "md/$name.md"
          done
          for slug in $FIRM_SLUGS; do
            mkdir -p md/prop-firm
            curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/md/prop-firm/$slug/" -o "md/prop-firm/$slug.md" || true
          done
          # Drop firm mirrors for firms no longer in the dataset.
          for f in md/prop-firm/*.md; do
            slug="$(basename "$f" .md)"
            echo "$FIRM_SLUGS" | grep -qx "$slug" || rm "$f"
          done

      - name: Fetch discovery files
        run: |
          set -euo pipefail
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/llms.txt -o llms.txt
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/ai.txt -o ai.txt

      - name: Update sync stamp
        run: |
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s|Last synced: .*|Last synced: $STAMP (auto, hourly)|" README.md

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -m "Hourly snapshot of the public dataset and markdown mirrors."
          git push
